name: Mirror to GitLab

on:
  push:
  delete:
  workflow_dispatch:

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Push branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          git clone --bare "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git push --prune "https://oauth2:${GITLAB_TOKEN}@gitlab.com/personal-projects7420146/${REPO_NAME}.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
